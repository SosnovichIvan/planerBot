services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: planerbot
      POSTGRES_PASSWORD: local-development
      POSTGRES_DB: planerbot
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planerbot"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
