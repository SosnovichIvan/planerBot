name: Pull request

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch direction
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            test "$HEAD_REF" = "develop"
            test "$SOURCE_REPO" = "$TARGET_REPO"
          else
            test "$BASE_REF" = "develop"
            test "$HEAD_REF" != "main"
            test "$HEAD_REF" != "develop"
          fi
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA" -- . ':(exclude).agents/skills/**'
      - name: Check deployment scripts and Compose (no release or deployment)
        env:
          RELEASE_TAG: verification
          BOT_TOKEN: '123456:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          POSTGRES_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          shellcheck deploy/*.sh
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml -f deploy/bootstrap.yaml config --quiet
          docker compose -f deploy/compose.yaml -f deploy/proxy.yaml config --quiet
          docker build --target backend -t planerbot-backend:verification .
          docker run --rm planerbot-backend:verification pip check
          docker build --target gateway -t planerbot-gateway:verification .
          docker build --target tunnel -t planerbot-tunnel:verification .
          bash deploy/smoke-test.sh
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: planerbot
          POSTGRES_PASSWORD: local-development
          POSTGRES_DB: planerbot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://planerbot:local-development@localhost:5432/planerbot_test
      TEST_DATABASE_URL: postgresql+asyncpg://planerbot:local-development@localhost:5432/planerbot_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check backend scripts deploy
      - run: ruff format --check backend scripts deploy
      - run: mypy
      - run: alembic upgrade head
      - run: alembic check
      - run: python scripts/check_migrations.py
      - run: pytest
      - run: python scripts/check_coverage.py
      - name: Check deployment validator coverage separately
        run: |
          COVERAGE_FILE=/tmp/deployment.coverage coverage run --branch --source=deploy -m pytest backend/tests/test_deployment.py --no-cov
          COVERAGE_FILE=/tmp/deployment.coverage coverage json -o /tmp/deployment-coverage.json
          python -c 'import json; t=json.load(open("/tmp/deployment-coverage.json"))["totals"]; assert t["covered_lines"]/t["num_statements"] >= .9; assert t["covered_branches"]/t["num_branches"] >= .9'
      - name: Verify migration downgrade and re-upgrade in isolated CI database
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Verify API schema generation
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- backend/openapi.json
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- src/shared/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Compile for verification only
        run: npm run build:check
