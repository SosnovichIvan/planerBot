[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "planerbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.31,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "aiohttp-socks>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "--cov=planerbot --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-report=xml --cov-fail-under=90"

[tool.coverage.run]
source = ["backend/src/planerbot"]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["planerbot"]
mypy_path = "backend/src"
