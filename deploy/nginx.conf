server {
    listen 80;
    server_name 193.124.129.252;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://193.124.129.252$request_uri; }
}

server {
    listen 443 ssl;
    server_name 193.124.129.252;
    ssl_certificate /etc/letsencrypt/live/193.124.129.252/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/193.124.129.252/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ~ ^/(api/|health/) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
    location = /telegram/webhook { return 404; }
    location ~ /\. { return 404; }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }
}
